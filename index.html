<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- הכותרת שתופיע בגוגל ובכרטיסיית הדפדפן -->
    <title>רון עם בלון 🎈 | סיפורי ילדים, ספרים מוקראים וסרטונים לילדים</title>
    
    <!-- התיאור שיופיע בתוצאות החיפוש בגוגל -->
    <meta name="description" content="אתר סיפורי ילדים קסום עם רון עם בלון! הקראת ספרים לילדים ולפעוטות, סרטונים חווייתיים ומהנים לצפייה ישירה. נהדר לילדים ולכל המשפחה.">
    
    <!-- מילות מפתח -->
    <meta name="keywords" content="ילדים, סיפורי ילדים, ספרים לילדים, הקראת ספרים, רון עם בלון, פעוטות, סרטונים לילדים">

    <!-- Google Tag Manager / Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-967S23RT27"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-967S23RT27');
    </script>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7195267048909916" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1.1em;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
        }
        .video-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .video-title {
            padding: 15px;
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>רון עם בלון 🎈 מקריא סיפורון 📚</h1>
    <p>בחרו סיפור, לחצו על התמונה, ותהנו!</p>

    <div class="video-grid" id="videoContainer"></div>

    <script>
        // הכנס כאן את מזהה הסרטון (החלק שמופיע בקישור של יוטיוב אחרי watch?v=)
        const stories = [
            { id: "YOUR_YOUTUBE_ID_1", title: "מנור כבר ילד גדול" }, 
            { id: "YOUR_YOUTUBE_ID_2", title: "סיפור שני" },
            { id: "YOUR_YOUTUBE_ID_3", title: "סיפור שלישי" }
        ];

        const container = document.getElementById('videoContainer');

        stories.forEach(story => {
            const thumbnailUrl = `https://img.youtube.com/vi/${story.id}/hqdefault.jpg`;
            const videoUrl = `https://www.youtube.com/watch?v=${story.id}`;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => window.open(videoUrl, '_blank');

            card.innerHTML = `
                <img src="${thumbnailUrl}" alt="${story.title}">
                <div class="video-title">${story.title}</div>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
